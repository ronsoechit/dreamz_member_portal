<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7b500">
  <title>Dreamz Fitness</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="{{ url_for('static', filename='css/premium.css') }}" rel="stylesheet">
</head>
<body class="auth-body bg-black text-white min-h-screen flex items-center justify-center px-4 py-8">
  <main class="auth-card w-full max-w-2xl rounded-lg border border-gray-800 bg-gray-900/95 p-5 shadow-2xl sm:p-7">
    <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Dreamz Fitness" class="auth-logo h-16">
    <div class="mt-6">
      <div class="text-xs font-semibold uppercase tracking-wide text-yellow-400">Dreamz Fitness</div>
      <div class="mt-3 grid gap-1 text-white">
        {% for card in language_cards %}
          <h1 class="{% if loop.first %}text-3xl font-bold sm:text-4xl{% else %}text-lg font-semibold text-gray-300 sm:text-xl{% endif %}">
            {{ card.title }}
          </h1>
        {% endfor %}
      </div>
    </div>
    <div class="mt-6 grid gap-3 sm:grid-cols-2">
      {% for card in language_cards %}
        <a
          href="{{ url_for('set_language', lang=card.code, next=next_url) }}"
          data-language-choice="{{ card.code }}"
          class="group min-h-28 rounded-lg border border-gray-700 bg-gray-950/70 p-4 text-left shadow-lg shadow-black/20 transition duration-150 hover:-translate-y-0.5 hover:border-yellow-400 hover:bg-gray-800/90 focus:outline-none focus:ring-2 focus:ring-yellow-400 active:translate-y-0 active:border-yellow-500 active:bg-gray-800"
          aria-label="{{ card.aria_label }}"
        >
          <span class="flex items-start justify-between gap-3">
            <span>
              <span class="block text-lg font-semibold text-white">{{ card.label }}</span>
              <span class="mt-1 block text-sm text-gray-400">{{ card.title }}</span>
            </span>
            <span class="rounded-full border border-yellow-500/30 bg-yellow-500/10 px-2 py-1 text-lg leading-none shadow-sm shadow-yellow-500/10" aria-hidden="true">
              {{ card.flag }}
            </span>
          </span>
          <span class="mt-4 inline-flex rounded-full bg-yellow-500 px-4 py-2 text-xs font-bold uppercase tracking-wide text-black transition group-hover:bg-yellow-400">
            {{ card.action }}
          </span>
        </a>
      {% endfor %}
    </div>
  </main>
  <script>
    document.querySelectorAll("[data-language-choice]").forEach((link) => {
      link.addEventListener("click", () => {
        try {
          window.localStorage.setItem("dreamz_language", link.dataset.languageChoice || "en");
        } catch (error) {
          // Cookie/session persistence still handles the language choice.
        }
      });
    });
  </script>
</body>
</html>
