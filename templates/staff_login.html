<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login | Dreamz Fitness</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="{{ url_for('static', filename='css/premium.css') }}" rel="stylesheet">
</head>
<body class="auth-body bg-black text-white min-h-screen flex items-center justify-center">
  <div class="auth-card w-full max-w-md rounded-lg border border-gray-800 bg-gray-900 p-6 shadow-lg">
    <div class="mb-6 text-center">
      <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Dreamz Fitness" class="auth-logo mx-auto h-16">
      <h1 class="mt-4 text-2xl font-bold">Staff Login</h1>
      <p class="mt-1 text-sm text-gray-400">Admin and manager access</p>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="mb-4 rounded border border-red-500/40 bg-red-500/10 p-3 text-sm text-red-200">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ form_action or url_for('staff_login') }}" class="space-y-4" data-loading-form>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="block">
        <span class="mb-1 block text-sm font-semibold text-gray-200">Username</span>
        <input
          type="text"
          name="username"
          autocomplete="username"
          class="w-full rounded border border-gray-700 bg-gray-800 p-2 text-white"
          required
        >
      </label>
      <label class="block">
        <span class="mb-1 block text-sm font-semibold text-gray-200">Password</span>
        <input
          type="password"
          name="password"
          autocomplete="current-password"
          class="w-full rounded border border-gray-700 bg-gray-800 p-2 text-white"
          required
        >
      </label>
      <button type="submit" data-loading-text="Logging in..." class="w-full rounded bg-yellow-500 py-2 font-bold text-black hover:bg-yellow-400">
        Log in
      </button>
    </form>
  </div>
  <script>
    document.querySelectorAll("[data-loading-form]").forEach((form) => {
      form.addEventListener("submit", (event) => {
        if (form.dataset.submitting === "true") {
          event.preventDefault();
          return;
        }
        form.dataset.submitting = "true";
        const button = form.querySelector("button[type='submit']");
        if (button) {
          button.textContent = button.dataset.loadingText || "Loading...";
          button.disabled = true;
          button.setAttribute("aria-busy", "true");
          button.classList.add("opacity-60", "cursor-wait");
        }
      });
    });
  </script>
</body>
</html>
